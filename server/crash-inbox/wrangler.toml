name = "lmcoop-crash-inbox"
main = "worker.js"
compatibility_date = "2025-01-01"

# Create the namespace once (npx wrangler kv namespace create REPORTS) and paste its id here.
[[kv_namespaces]]
binding = "REPORTS"
id = "REPLACE-WITH-THE-NAMESPACE-ID"

[vars]
# A PRIVATE repository whose issues you review; the token below only needs "Issues: read and write" on it.
GITHUB_REPO = "Recoi1/lmcoop-crash-reports"

# Secret (never in this file): npx wrangler secret put GITHUB_TOKEN
